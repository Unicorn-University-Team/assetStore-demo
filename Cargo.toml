[package]
name = "assetstore-demo"
version = "0.2.0"
edition = "2024"
description = "Demo data for assetStore: seed, wipe and status"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# Small binary: the demo runs as a one-off job, so build time and size matter more than speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
