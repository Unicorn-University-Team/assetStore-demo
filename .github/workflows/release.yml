# Tag vX.Y.Z → a GitHub release with ready binaries (Linux x86_64, macOS Apple Silicon),
# so nobody needs Rust to run the tool locally.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: 🦀 Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 📦 Package
        run: |
          NAME=assetstore-demo-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$NAME" && cp target/${{ matrix.target }}/release/assetstore-demo README.md .env.example "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: softprops/action-gh-release@v3
        with:
          files: assetstore-demo-*.tar.gz
          generate_release_notes: true
