# The "Generate demo data" button: Actions -> Demo data -> Run workflow -> choose status / seed / wipe.
# The result is in the run's summary (counts, links, demo logins; never the password).
name: Demo data

on:
  workflow_dispatch:
    inputs:
      command:
        description: "status = jen se podívat, seed = vytvořit/doplnit demo data, wipe = smazat demo data"
        type: choice
        options: [status, seed, wipe]
        default: status

# One run at a time, so two seeds never upload the same assets twice.
concurrency: demo-data

permissions:
  contents: read
  id-token: write # temporary AWS credentials through OIDC for the SQL step, no keys stored in GitHub

jobs:
  demo:
    name: ${{ inputs.command }}
    runs-on: ubuntu-latest
    env:
      API_URL: https://3-125-15-78.sslip.io/api
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      SITE_AUTH_USER: ${{ secrets.SITE_AUTH_USER }}
      SITE_AUTH_PASSWORD: ${{ secrets.SITE_AUTH_PASSWORD }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Demo data through the API
        run: ./target/release/assetstore-demo "$COMMAND" --yes --sql-out demo.sql --summary "$GITHUB_STEP_SUMMARY"

      # Roles, blocked account, dates, download counts and deleting accounts: SQL in the db container on the server.
      # The role (aws/setup-demo-role.sh) accepts only the main branch of this repository and may only send a
      # command to the server.
      - uses: aws-actions/configure-aws-credentials@v6
        if: hashFiles('demo.sql') != ''
        with:
          role-to-assume: ${{ vars.AWS_DEMO_ROLE_ARN }}
          aws-region: eu-central-1
      - name: SQL on the server
        if: hashFiles('demo.sql') != ''
        env:
          INSTANCE_ID: i-0af9c67b1566f5c8d
        run: |
          SQL=$(base64 -w0 demo.sql)
          COMMAND="cd /home/ubuntu/assetStore && echo $SQL | base64 -d | docker compose exec -T db psql -U assetstore -d assetstore -v ON_ERROR_STOP=1 -q"
          jq -n --arg command "$COMMAND" '{commands: [$command]}' > ssm-params.json
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "Demo data $GITHUB_RUN_ID" --parameters file://ssm-params.json --query Command.CommandId --output text)
          STATUS=Pending
          for _ in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          STATEMENTS=$(grep -cE '^(UPDATE|DELETE)' demo.sql)
          if [ "$STATUS" = Success ]; then
            echo "> SQL na serveru: OK ($STATEMENTS příkazů: role, blokace, data publikace, stažení, mazání účtů)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **SQL na serveru selhalo ($STATUS)**, podrobnosti v logu kroku *SQL on the server*." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
