# 🎛️ The demo control panel: Actions → Demo data → Run workflow.
# The result (counts, links to try, demo logins; never the password) is in the run's Summary.
name: Demo data
run-name: >-
  ${{ github.event_name == 'schedule' && '🩺 Denní kontrola' ||
      format('{0} {1} · {2}',
        inputs.command == 'seed' && '🌱' || inputs.command == 'reset' && '♻️' || inputs.command == 'wipe' && '🧹' ||
        inputs.command == 'check' && '🩺' || '📊',
        inputs.command, github.actor) }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: "📊 status · 🩺 check (ověří i náhledy) · 🌱 seed (vytvořit/doplnit) · ♻️ reset (smazat a znovu) · 🧹 wipe (smazat)"
        type: choice
        options: [status, check, seed, reset, wipe]
        default: status
      confirm:
        description: "Jen pro reset a wipe: napiš SMAZAT"
        type: string
        required: false
      dry_run:
        description: "🧪 Nanečisto: jen ukázat, co by se stalo"
        type: boolean
        default: false
  # Every morning: services up and the showcase assets answer (detail + preview). A failed run sends an e-mail.
  schedule:
    - cron: "0 6 * * *"

# One run at a time, so two seeds never upload the same assets twice.
concurrency: demo-data

permissions:
  contents: read
  id-token: write # temporary AWS credentials through OIDC for the SQL steps, no keys stored in GitHub

env:
  API_URL: https://3-125-15-78.sslip.io/api
  INSTANCE_ID: i-0af9c67b1566f5c8d
  DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
  SITE_AUTH_USER: ${{ secrets.SITE_AUTH_USER }}
  SITE_AUTH_PASSWORD: ${{ secrets.SITE_AUTH_PASSWORD }}
  COMMAND: ${{ github.event_name == 'schedule' && 'check' || inputs.command }}
  DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}

jobs:
  demo:
    name: ${{ github.event_name == 'schedule' && 'check' || inputs.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🔒 Confirmation
        if: (inputs.command == 'wipe' || inputs.command == 'reset') && !inputs.dry_run && inputs.confirm != 'SMAZAT'
        run: |
          {
            echo "## 🔒 Nic se nesmazalo"
            echo
            echo "\`$COMMAND\` smaže demo data na webu. Spusť ho znovu a do pole **confirm** napiš \`SMAZAT\`."
            echo "Nebo zapni **dry_run** a podívej se, co by se smazalo."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 🦀 Build
        run: cargo build --release --locked

      - name: 🔑 AWS credentials
        if: (env.COMMAND == 'seed' || env.COMMAND == 'wipe' || env.COMMAND == 'reset') && !inputs.dry_run
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEMO_ROLE_ARN }}
          aws-region: eu-central-1

      - name: 🧹 Wipe
        if: env.COMMAND == 'wipe' || env.COMMAND == 'reset'
        run: ./target/release/assetstore-demo wipe --yes $DRY_RUN --sql-out wipe.sql --summary "$GITHUB_STEP_SUMMARY"
      - name: 🗄️ SQL on the server (wipe)
        if: (env.COMMAND == 'wipe' || env.COMMAND == 'reset') && !inputs.dry_run
        run: .github/scripts/run-sql.sh wipe.sql wipe

      - name: 🌱 Seed
        if: env.COMMAND == 'seed' || env.COMMAND == 'reset'
        run: ./target/release/assetstore-demo seed --yes $DRY_RUN --sql-out seed.sql --summary "$GITHUB_STEP_SUMMARY"
      - name: 🗄️ SQL on the server (seed)
        if: (env.COMMAND == 'seed' || env.COMMAND == 'reset') && !inputs.dry_run
        run: .github/scripts/run-sql.sh seed.sql seed

      # After any change, and for status/check themselves: what is on the site now.
      - name: 🩺 Check
        if: env.COMMAND != 'status' && env.COMMAND != 'wipe' && !inputs.dry_run
        run: ./target/release/assetstore-demo check --summary "$GITHUB_STEP_SUMMARY"
      - name: 📊 Status
        if: env.COMMAND == 'status' || (env.COMMAND == 'wipe' && !inputs.dry_run)
        run: ./target/release/assetstore-demo status --summary "$GITHUB_STEP_SUMMARY"
